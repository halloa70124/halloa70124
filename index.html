<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skunk Trail 2X - Chibi Anime Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #111; }
    canvas { width: 100%; height: 100%; max-width: 960px; max-height: 540px; background: #87CEEB; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    #title-screen { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; text-align: center; }
    #title-screen h1 { font-size: 32px; color: #fde047; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }
    .mode-btn { width: 240px; padding: 12px; margin: 8px; border: 2px solid #fff; border-radius: 20px; background: #d946ef; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 2px 4px 0 #000; text-shadow: 1px 1px 0 #000; }
    .mode-btn.train { background: #3b82f6; }
    #debug-toggle { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(0,0,0,0.7); border: 2px solid #fff; color: #fff; border-radius: 12px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
    #debug-panel { display: none; position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(0,0,0,0.9); border: 2px solid #fde047; border-radius: 12px; padding: 15px; z-index: 40; font-size: 13px; }
    .dbg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .dbg-btn { padding: 8px; border-radius: 8px; border: 2px solid #fff; background: #475569; color: #fff; font-weight: bold; text-align: center; cursor: pointer; }
    .dbg-btn.on { background: #22c55e; }
    .dbg-btn.spawn { background: #8b5cf6; }
    #controls { position: absolute; inset: 0; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px; z-index: 20; }
    .dpad, .actions { position: relative; width: 140px; height: 140px; pointer-events: auto; }
    .btn { position: absolute; background: rgba(255, 255, 255, 0.3); border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 20px; text-shadow: 1px 1px 2px #000; }
    .btn:active, .btn.active { background: rgba(255, 255, 255, 0.6); transform: scale(0.9); }
    #btn-up { left: 45px; top: 0; width: 50px; height: 50px; }
    #btn-down { left: 45px; bottom: 0; width: 50px; height: 50px; }
    #btn-left { left: 0; top: 45px; width: 50px; height: 50px; }
    #btn-right { right: 0; top: 45px; width: 50px; height: 50px; }
    .act-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 14px; }
    #btn-a { left: 0; bottom: 0; background: rgba(56, 189, 248, 0.4); }
    #btn-b { left: 70px; bottom: 25px; background: rgba(163, 230, 53, 0.4); }
    #btn-c { right: 0; top: 0; background: rgba(192, 132, 252, 0.4); }
    #btn-sp { left: 0; top: -20px; width: 60px; height: 40px; border-radius: 20px; background: rgba(250, 204, 21, 0.5); font-size: 12px; }
    #rotate-hint { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
    @media (orientation: portrait) { #rotate-hint { display: flex; } }
  </style>
</head>
<body>
<div id="rotate-hint"><h2>📱 請將手機橫向放置</h2></div>
<div id="game-container">
  <canvas id="game" width="800" height="450"></canvas>
  
  <div id="title-screen">
    <h1>SKUNK TRAIL 2X</h1>
    <p style="color:#ccc;">(Smooth Cel-Shaded Engine)</p>
    <button class="mode-btn" onclick="startGame('normal')">▶ 進入天台關卡</button>
    <button class="mode-btn train" onclick="startGame('training')">🏋️ 訓練場 (無限HP/MP)</button>
  </div>

  <button id="debug-toggle" onclick="toggleDebug()">🔧 選單</button>
  
  <div id="debug-panel">
    <div class="dbg-grid">
      <div class="dbg-btn" id="dbg-god" onclick="toggleCheats('god')">❤️ 鎖血: 關</div>
      <div class="dbg-btn" id="dbg-inf" onclick="toggleCheats('inf')">⚡ 無限氣: 關</div>
      <div class="dbg-btn" id="dbg-ohko" onclick="toggleCheats('ohko')">💪 秒殺: 關</div>
      <div class="dbg-btn" onclick="clearEnemies()">🧹 清空敵人</div>
    </div>
    <div class="dbg-grid">
      <div class="dbg-btn spawn" onclick="spawnEnemy('silk')">➕ 召喚 Silk</div>
      <div class="dbg-btn spawn" onclick="spawnEnemy('tepet')">➕ 召喚 Tepet</div>
    </div>
    <div class="dbg-grid" style="grid-template-columns: 1fr;">
      <div class="dbg-btn" style="background:#dc2626;" onclick="returnToTitle()">🏠 離開遊戲</div>
    </div>
  </div>

  <div id="controls">
    <div class="dpad">
      <div class="btn" id="btn-up">▲</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="actions">
      <div class="btn act-btn" id="btn-sp">SP</div>
      <div class="btn act-btn" id="btn-a">A</div>
      <div class="btn act-btn" id="btn-b">B</div>
      <div class="btn act-btn" id="btn-c">C</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const input = { left: false, right: false, up: false, down: false, a: false, b: false, c: false, sp: false };
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); input[key] = true; el.classList.add('active'); };
  const end = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down');
bindBtn('btn-a', 'a'); bindBtn('btn-b', 'b'); bindBtn('btn-c', 'c'); bindBtn('btn-sp', 'sp');
window.addEventListener('keydown', (e) => {
  if(e.key==='ArrowLeft'||e.key==='a') input.left=true; if(e.key==='ArrowRight'||e.key==='d') input.right=true;
  if(e.key==='ArrowUp'||e.key==='w') input.up=true; if(e.key==='ArrowDown'||e.key==='s') input.down=true;
  if(e.key==='j') input.a=true; if(e.key==='k') input.b=true; if(e.key==='l') input.c=true; if(e.key===' ') input.sp=true;
});
window.addEventListener('keyup', (e) => {
  if(e.key==='ArrowLeft'||e.key==='a') input.left=false; if(e.key==='ArrowRight'||e.key==='d') input.right=false;
  if(e.key==='ArrowUp'||e.key==='w') input.up=false; if(e.key==='ArrowDown'||e.key==='s') input.down=false;
  if(e.key==='j') input.a=false; if(e.key==='k') input.b=false; if(e.key==='l') input.c=false; if(e.key===' ') input.sp=false;
});

// Game State
const GROUND_Y = 380;
let cameraX = 0;
let screenShake = 0;
let particles = [];
let afterimages = [];
let enemies = [];
let player = null;
let gameMode = 'normal';
let score = 14500;
let combo = 0;
let comboTimer = 0;

const cheats = { god: false, inf: false, ohko: false };
function toggleDebug() { const p = document.getElementById('debug-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
function toggleCheats(key) { 
  cheats[key] = !cheats[key]; 
  document.getElementById('dbg-'+key).classList.toggle('on', cheats[key]); 
  document.getElementById('dbg-'+key).innerText = document.getElementById('dbg-'+key).innerText.replace(/開|關/, cheats[key]?'開':'關');
}
function clearEnemies() { enemies = []; }
function returnToTitle() { document.getElementById('debug-panel').style.display='none'; document.getElementById('title-screen').style.display='flex'; player=null; }

// --- VECTOR DRAWING UTILS ---
function drawCircle(x, y, r, fill, stroke, lw=2) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke(); }
}
function drawPath(points, fill, stroke, lw=2, close=true) {
  ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
  for(let i=1; i<points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  if(close) ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.stroke(); }
}
function drawAnimeEye(x, y, scale=1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  // White
  ctx.beginPath(); ctx.ellipse(0, 0, 7, 10, 0, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
  // Iris (Blue/Purple gradient)
  let grad = ctx.createLinearGradient(0, -8, 0, 8);
  grad.addColorStop(0, '#1e3a8a'); grad.addColorStop(1, '#818cf8');
  ctx.beginPath(); ctx.ellipse(1, 0, 4, 8, 0, 0, Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  // Pupil
  ctx.beginPath(); ctx.ellipse(1, -2, 2, 4, 0, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
  // Highlight
  drawCircle(0, -4, 2, '#fff', null);
  drawCircle(2, 3, 1, '#fff', null);
  // Eyelash
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.quadraticCurveTo(0, -12, 8, -6); ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.stroke();
  ctx.restore();
}

// --- CHARACTER RENDERER (Chibi Style) ---
function drawChibi(cx, cy, facing, animFrame, state, config, alpha=1, tint=null) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(facing, 1);
  ctx.globalAlpha = alpha;
  
  if (tint) {
    ctx.globalCompositeOperation = 'source-atop';
    // Emulate the golden hit effect from the image
    if(tint === 'gold') ctx.filter = 'sepia(1) saturate(5) hue-rotate(5deg) brightness(1.5)';
  }

  const bob = (state === 'idle' || state === 'walk') ? Math.sin(animFrame * 0.2) * 3 : 0;
  const legAngle = (state === 'walk') ? Math.sin(animFrame * 0.4) * 20 : 0;

  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000'; // Pure black outline like original image

  // Back Hair
  ctx.fillStyle = config.hair;
  if(config.hairStyle === 'long') {
    ctx.beginPath(); ctx.moveTo(-15, -60); ctx.quadraticCurveTo(-40, -20, -20, 10); ctx.quadraticCurveTo(-5, 0, -15, -60); ctx.fill(); ctx.stroke();
  } else {
    drawCircle(-5, -65, 25, config.hair, '#000');
  }

  // Legs (Thick chibi legs)
  ctx.save(); ctx.translate(-8, -25); ctx.rotate(legAngle * Math.PI/180);
  drawPath([[-6,0],[6,0],[4,25],[-4,25]], config.shoe, '#000'); ctx.restore();
  ctx.save(); ctx.translate(8, -25); ctx.rotate(-legAngle * Math.PI/180);
  drawPath([[-6,0],[6,0],[4,25],[-4,25]], config.shoe, '#000'); ctx.restore();

  if(state === 'attack') {
    ctx.translate(0, 15); // Bend down
    ctx.rotate(0.3);
  }

  // Body (Dress/Suit)
  ctx.fillStyle = config.clothes;
  ctx.beginPath();
  ctx.moveTo(-12, -45 + bob); ctx.lineTo(12, -45 + bob);
  ctx.quadraticCurveTo(20, -10 + bob, 15, -20 + bob);
  ctx.lineTo(-15, -20 + bob); ctx.quadraticCurveTo(-20, -10 + bob, -12, -45 + bob);
  ctx.fill(); ctx.stroke();

  // Arms
  ctx.save();
  ctx.translate(5, -40 + bob);
  if(state === 'attack') ctx.rotate(-1.5);
  else ctx.rotate(Math.sin(animFrame * 0.4) * 0.5);
  drawPath([[-4,0],[4,0],[3,20],[-3,20]], config.clothes, '#000');
  // Hand
  drawCircle(0, 22, 5, '#ffe4c4', '#000');
  ctx.restore();

  // Head (Oversized for 2.5D Chibi)
  ctx.translate(0, -60 + bob);
  // Face shape
  ctx.fillStyle = '#ffe4c4';
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  
  if(state === 'hurt') {
    // > < eyes
    ctx.beginPath(); ctx.moveTo(5, -5); ctx.lineTo(10, 0); ctx.lineTo(5, 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, -5); ctx.lineTo(13, 0); ctx.lineTo(18, 5); ctx.stroke();
  } else {
    // Normal anime eyes
    drawAnimeEye(6, 0, 1.2);
    drawAnimeEye(16, 0, 1.1);
  }

  // Mouth
  ctx.fillStyle = '#f43f5e';
  if(state === 'attack' || state === 'hurt') {
    drawCircle(12, 10, 4, '#f43f5e', '#000');
  } else {
    ctx.beginPath(); ctx.arc(12, 10, 3, 0, Math.PI); ctx.fill(); ctx.stroke();
  }

  // Front Hair / Bangs
  ctx.fillStyle = config.hair;
  ctx.beginPath();
  ctx.moveTo(-25, -10); ctx.quadraticCurveTo(-20, -35, 0, -25);
  ctx.quadraticCurveTo(15, -30, 25, -5); ctx.lineTo(15, -18);
  ctx.lineTo(5, -8); ctx.lineTo(0, -20); ctx.lineTo(-10, -5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  
  // Highlight
  ctx.beginPath(); ctx.arc(0, -18, 15, Math.PI*1.1, Math.PI*1.9);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth=4; ctx.stroke();

  // Accessories (Wings/Headband)
  if(config.acc) {
    ctx.fillStyle = config.accColor;
    ctx.lineWidth = 2; ctx.strokeStyle = '#000';
    ctx.beginPath(); ctx.moveTo(-15,-10); ctx.lineTo(-30,-25); ctx.lineTo(-10,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  ctx.restore();
}

function spawnHitEffect(x, y, isBig=false) {
  const count = isBig ? 30 : 10;
  for(let i=0; i<count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random()-0.5)*(isBig?15:8),
      vy: (Math.random()-0.5)*(isBig?15:8),
      life: isBig?25:15,
      maxLife: isBig?25:15,
      size: Math.random()*20 + 10,
      color: '#fde047'
    });
  }
}

// Entities
class Character {
  constructor(x, type) {
    this.x = x; this.y = GROUND_Y;
    this.vx = 0; this.vy = 0;
    this.facing = 1; this.state = 'idle';
    this.stateTimer = 0; this.animFrame = 0;
    this.hp = 100; this.maxHp = 100; this.meter = 500;
    this.type = type;
    this.tint = null; this.tintTimer = 0;

    if(type === 'miranda' || type === 'silk') {
      this.config = { hair: '#e2e8f0', hairStyle: 'long', clothes: '#b45309', shoe: '#475569', acc: true, accColor: '#9333ea' };
    } else {
      // Tepet / Enemy
      this.config = { hair: '#eab308', hairStyle: 'short', clothes: '#ca8a04', shoe: '#a16207', acc: false };
    }
  }
  
  update() {
    this.animFrame++;
    if(this.tintTimer > 0) { this.tintTimer--; if(this.tintTimer<=0) this.tint = null; }
    
    if(this.stateTimer > 0) {
      this.stateTimer--;
      if(this.state === 'attack') {
        if(this.stateTimer === 15) {
          // Release Gas / Energy blast
          spawnHitEffect(this.x + this.facing*30, this.y - 20, true);
          enemies.forEach(e => {
            if(Math.abs(e.x - this.x) < 100 && e.hp > 0) {
              e.hp -= (cheats.ohko ? 100 : 15);
              e.vx = this.facing * 12;
              e.vy = -5;
              e.state = 'hurt';
              e.stateTimer = 20;
              e.tint = 'gold'; e.tintTimer = 20;
              combo++; comboTimer=60;
              score += 150;
            }
          });
        }
      }
      if(this.stateTimer <= 0 && this.y >= GROUND_Y) this.state = 'idle';
    }

    if(this.state === 'idle' || this.state === 'walk') {
      if(this === player) {
        if(input.b && this.state !== 'attack') {
          this.state = 'attack'; this.stateTimer = 30; this.vx = 0;
        } else if(input.left) { this.vx = -5; this.facing = -1; this.state = 'walk'; }
        else if(input.right) { this.vx = 5; this.facing = 1; this.state = 'walk'; }
        else { this.vx = 0; this.state = 'idle'; }
        
        if(input.a && this.y >= GROUND_Y) { this.vy = -14; this.state = 'jump'; }
      } else {
        // Simple AI
        let dist = player.x - this.x;
        this.facing = dist > 0 ? 1 : -1;
        if(Math.abs(dist) < 80 && Math.random() < 0.05) {
          this.state = 'attack'; this.stateTimer = 30; this.vx = 0;
        } else if(Math.abs(dist) > 90) {
          this.vx = this.facing * 2; this.state = 'walk';
        } else { this.vx = 0; this.state = 'idle'; }
      }
    }

    this.x += this.vx; this.y += this.vy;
    if(this.y < GROUND_Y) { this.vy += 0.8; } 
    else { this.y = GROUND_Y; this.vy = 0; if(this.state==='jump') this.state='idle'; }
    
    // Bounds
    this.x = Math.max(50, Math.min(1500, this.x));
    
    if(cheats.god && this === player) this.hp = this.maxHp;
    if(cheats.inf && this === player) this.meter = 500;
  }
  
  draw() {
    drawChibi(this.x - cameraX, this.y, this.facing, this.animFrame, this.state, this.config, 1, this.tint);
  }
}

function spawnEnemy(type) {
  if(!player) return;
  enemies.push(new Character(player.x + 200, type));
}

function startGame(mode) {
  gameMode = mode;
  document.getElementById('title-screen').style.display = 'none';
  player = new Character(200, 'silk');
  enemies = [];
  if(mode !== 'training') {
    spawnEnemy('tepet');
  } else {
    cheats.god = true; cheats.inf = true; toggleCheats('god'); toggleCheats('inf');
    spawnEnemy('tepet');
  }
}

// --- ENVIRONMENT RENDERER (Eight Marbles Rooftop Style) ---
function drawBackground() {
  // Sky
  let sky = ctx.createLinearGradient(0,0,0,300);
  sky.addColorStop(0, '#3b82f6'); sky.addColorStop(1, '#bae6fd');
  ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width,GROUND_Y);

  const cx = cameraX * 0.3;
  
  // Distant City / Mountains
  ctx.fillStyle = '#64748b';
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);
  for(let i=0; i<canvas.width; i+=100) ctx.lineTo(i, 200 + Math.sin((i+cx)*0.01)*30);
  ctx.lineTo(canvas.width, GROUND_Y); ctx.fill();
  
  // Green Trees layer
  ctx.fillStyle = '#166534';
  for(let i=-200; i<2000; i+=150) {
    drawCircle(i - cx, 280, 80, '#166534', '#14532d', 3);
    drawCircle(i - cx + 70, 300, 60, '#15803d', '#14532d', 3);
  }

  // School Building on Right
  const bldgX = 800 - cx*1.2;
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(bldgX, 50, 400, GROUND_Y-50);
  ctx.strokeStyle = '#000'; ctx.lineWidth=2; ctx.strokeRect(bldgX, 50, 400, GROUND_Y-50);
  // Windows
  ctx.fillStyle = '#334155';
  for(let wy=100; wy<250; wy+=60) {
    for(let wx=20; wx<300; wx+=80) {
      ctx.fillRect(bldgX + wx, wy, 60, 40); ctx.strokeRect(bldgX + wx, wy, 60, 40);
    }
  }

  // Rooftop Railing
  const railCx = cameraX * 0.8;
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 310); ctx.lineTo(canvas.width, 310); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 340); ctx.lineTo(canvas.width, 340); ctx.stroke();
  ctx.lineWidth = 6; ctx.strokeStyle = '#cbd5e1';
  for(let i = -(railCx%60); i<canvas.width; i+=60) {
    ctx.beginPath(); ctx.moveTo(i, 310); ctx.lineTo(i, GROUND_Y); ctx.stroke();
    // Black outlines for authentic cel-shaded prop look
    ctx.lineWidth = 1; ctx.strokeStyle='#000';
    ctx.strokeRect(i-3, 310, 6, GROUND_Y-310);
  }
  ctx.lineWidth = 1; ctx.strokeStyle='#000';
  ctx.strokeRect(0, 308, canvas.width, 4);
  ctx.strokeRect(0, 338, canvas.width, 4);

  // Rooftop Floor (Perspective Tiles)
  ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height-GROUND_Y);
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(canvas.width, GROUND_Y); ctx.stroke();
  
  const floorOffset = -(cameraX % 120);
  for(let i = floorOffset - 200; i < canvas.width + 200; i+=120) {
    ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.lineTo(i - 100, canvas.height); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y+30); ctx.lineTo(canvas.width, GROUND_Y+30); ctx.stroke();
}

// --- UI / HUD RENDERER (Exact Match to Image) ---
function drawHUD() {
  if(!player) return;
  const cw = canvas.width;
  
  // Top Health Bars
  // Pink Outline, Magenta backdrop, Green Fill
  ctx.lineWidth = 4;
  
  // P1 Bar
  ctx.fillStyle = '#a21caf'; // dark magenta
  ctx.beginPath(); ctx.moveTo(80, 40); ctx.lineTo(350, 40); ctx.lineTo(330, 60); ctx.lineTo(80, 60); ctx.fill();
  ctx.fillStyle = '#22c55e'; // bright green
  let p1w = 80 + (270 * (player.hp/player.maxHp));
  ctx.beginPath(); ctx.moveTo(80, 40); ctx.lineTo(p1w, 40); ctx.lineTo(p1w-20, 60); ctx.lineTo(80, 60); ctx.fill();
  ctx.strokeStyle = '#ec4899'; // pink border
  ctx.beginPath(); ctx.moveTo(80, 40); ctx.lineTo(350, 40); ctx.lineTo(330, 60); ctx.lineTo(80, 60); ctx.closePath(); ctx.stroke();

  // P2 Bar (Enemy 0)
  let eHp = enemies.length > 0 ? enemies[0].hp / enemies[0].maxHp : 0;
  ctx.fillStyle = '#a21caf';
  ctx.beginPath(); ctx.moveTo(cw-80, 40); ctx.lineTo(cw-350, 40); ctx.lineTo(cw-330, 60); ctx.lineTo(cw-80, 60); ctx.fill();
  ctx.fillStyle = '#22c55e';
  let p2w = cw-80 - (270 * eHp);
  ctx.beginPath(); ctx.moveTo(cw-80, 40); ctx.lineTo(p2w, 40); ctx.lineTo(p2w+20, 60); ctx.lineTo(cw-80, 60); ctx.fill();
  ctx.strokeStyle = '#ec4899';
  ctx.beginPath(); ctx.moveTo(cw-80, 40); ctx.lineTo(cw-350, 40); ctx.lineTo(cw-330, 60); ctx.lineTo(cw-80, 60); ctx.closePath(); ctx.stroke();

  // Center Gold Star & Infinity
  ctx.save(); ctx.translate(cw/2, 45);
  ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(20,-10); ctx.lineTo(60,0); ctx.lineTo(20,10); ctx.lineTo(0,40); ctx.lineTo(-20,10); ctx.lineTo(-60,0); ctx.lineTo(-20,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
  drawCircle(0, 0, 22, '#334155', '#fde047', 4);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
  ctx.fillText('∞', 0, 2);
  // Little stars
  ctx.translate(40, -30); ctx.scale(0.4, 0.4);
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(15,-10); ctx.lineTo(40,0); ctx.lineTo(15,10); ctx.lineTo(0,30); ctx.lineTo(-15,10); ctx.lineTo(-40,0); ctx.lineTo(-15,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Character Portraits
  // P1 Portrait
  drawCircle(60, 50, 45, '#1e1b4b', '#000', 3);
  ctx.save(); ctx.beginPath(); ctx.arc(60, 50, 45, 0, Math.PI*2); ctx.clip();
  drawChibi(60, 100, 1, 0, 'idle', player.config, 1);
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.textAlign='center';
  ctx.strokeText('Silk', 60, 115); ctx.fillText('Silk', 60, 115);

  // P2 Portrait
  drawCircle(cw-60, 50, 45, '#1e1b4b', '#000', 3);
  ctx.save(); ctx.beginPath(); ctx.arc(cw-60, 50, 45, 0, Math.PI*2); ctx.clip();
  if(enemies.length > 0) drawChibi(cw-60, 100, -1, 0, 'idle', enemies[0].config, 1);
  ctx.restore();
  ctx.strokeText('Tepet', cw-60, 115); ctx.fillText('Tepet', cw-60, 115);

  // Score
  ctx.textAlign = 'left'; ctx.font = 'bold 26px Arial';
  ctx.strokeText(score.toString(), 220, 35);
  ctx.fillStyle = '#93c5fd'; ctx.fillText(score.toString(), 220, 35);

  // Bottom Energy Meters (The big '5' inside gold circles)
  const orbs = Math.floor(player.meter/100);
  ctx.save(); ctx.translate(60, cw>800 ? 380 : 400);
  // Purple tail
  ctx.strokeStyle = '#7e22ce'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(40,20); ctx.quadraticCurveTo(80,-10, 120,20); ctx.stroke();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); // Inner line hack
  
  // Meter bar
  ctx.fillStyle = '#0f172a'; ctx.fillRect(40, 25, 200, 10);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(40, 25, (player.meter/500)*200, 10);
  ctx.strokeRect(40, 25, 200, 10);
  
  // Circle
  drawCircle(0, 0, 40, '#facc15', '#ea580c', 4);
  // Number
  ctx.font = 'bold 65px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#93c5fd'; ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 6;
  ctx.strokeText(orbs, 0, 5); ctx.fillText(orbs, 0, 5);
  ctx.restore();
  
  // Enemy Energy Meter (Bottom Right)
  ctx.save(); ctx.translate(cw-60, cw>800 ? 380 : 400);
  ctx.strokeStyle = '#7e22ce'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-40,20); ctx.quadraticCurveTo(-80,-10, -120,20); ctx.stroke();
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-240, 25, 200, 10);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(-240, 25, (500/500)*200, 10); // Fake enemy max meter
  ctx.strokeRect(-240, 25, 200, 10);
  drawCircle(0, 0, 40, '#facc15', '#ea580c', 4);
  ctx.font = 'bold 65px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#93c5fd'; ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 6;
  ctx.strokeText('5', 0, 5); ctx.fillText('5', 0, 5);
  ctx.restore();
}

function loop() {
  requestAnimationFrame(loop);
  if(!player) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  const targetCam = Math.max(0, Math.min(1000, player.x - canvas.width/2));
  cameraX += (targetCam - cameraX) * 0.15;

  drawBackground();

  // Particles (Glow effect emulation without blocks)
  ctx.globalCompositeOperation = 'lighter';
  for(let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    let alpha = p.life / p.maxLife;
    ctx.save(); ctx.globalAlpha = alpha;
    let grad = ctx.createRadialGradient(p.x - cameraX, p.y, 0, p.x - cameraX, p.y, p.size);
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, p.color); grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad; ctx.fillRect(p.x - cameraX - p.size, p.y - p.size, p.size*2, p.size*2);
    ctx.restore();
    if(p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  player.update();
  for(let i=enemies.length-1; i>=0; i--) {
    enemies[i].update();
    if(enemies[i].hp <= 0 && gameMode !== 'training') enemies.splice(i, 1);
    else enemies[i].draw();
  }
  player.draw();

  drawHUD();
}

loop();
</script>
